name: Keep Supabase project alive

# A free-tier Supabase project auto-pauses after 7 days with zero API
# requests, which would silently take the whole community library offline.
# This does one harmless, public, read-only request every few days so the
# project's activity clock never runs out. It reuses the same public
# Supabase URL and publishable ("anon") key already committed in
# deploy.yml — both are meant to be public; Row Level Security in
# supabase/schema.sql is what actually protects the data, not secrecy of
# this key. No new GitHub secret needed.

on:
  schedule:
    # Every 3 days, comfortably under the 7-day pause window even if one
    # scheduled run gets skipped or fails.
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the public routes table
        env:
          SUPABASE_URL: https://ovqjrpyvceehnzqnluut.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_iZQZuuhzPQuCqW00EqnkJg_4De09xR1
        run: |
          curl -sf -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/routes?select=id&limit=1" -o /dev/null
