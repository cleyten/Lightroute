name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ORS_KEY: ${{ secrets.ORS_KEY }}
          VITE_THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
          # The Supabase URL and publishable ("anon") key are safe to be public
          # (they ship in the client bundle; RLS protects the data). Inlined
          # here so the deployed build works without extra GitHub secrets.
          VITE_SUPABASE_URL: https://ovqjrpyvceehnzqnluut.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_iZQZuuhzPQuCqW00EqnkJg_4De09xR1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
