<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2424e8" />
    <title>Lightroute</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="brand">
          <h1>Lightroute</h1>
          <span class="brand-sub">Route planner</span>
        </header>
        <p class="hint">Click the map to add route points. Drag a point to reroute, click the line to insert a via point, click near point 1 to close the loop.</p>
        <div id="search-box">
          <span class="save-row">
            <input id="search-input" type="text" placeholder="Search address or place" autocomplete="off" aria-label="Search address or place" />
            <button id="btn-locate" title="Use my GPS location">📍</button>
          </span>
          <ul id="search-results" hidden></ul>
        </div>
        <div class="segmented" id="bike-type">
          <button data-bike="race">Race</button>
          <button data-bike="gravel">Gravel</button>
          <button data-bike="mtb">MTB</button>
        </div>
        <label class="field" id="traffic-label">
          Avoid traffic
          <select id="traffic-select">
            <option value="0">No (fastest route)</option>
            <option value="1">Quiet roads</option>
            <option value="2">Very quiet roads</option>
          </select>
        </label>
        <div id="stats">
          <div class="stat">
            <span class="stat-label">Distance</span>
            <span class="stat-value" id="stat-distance">–</span>
          </div>
          <div class="stat">
            <span class="stat-label">Elevation gain</span>
            <span class="stat-value" id="stat-ascend">–</span>
          </div>
        </div>
        <div id="chart-wrap" hidden>
          <canvas id="elevation-chart"></canvas>
        </div>
        <div id="surface" hidden></div>
        <div id="climbs" hidden>
          <span class="section-label">Climbs</span>
          <ul id="climbs-list"></ul>
        </div>
        <div id="cafes" hidden>
          <span class="section-label">Coffee stop</span>
          <span class="save-row">
            <input id="cafe-km" type="number" min="0" step="5" placeholder="around km (optional)" aria-label="Find cafés around this km mark" />
            <button id="btn-cafes">Find cafés</button>
          </span>
          <ul id="cafes-list"></ul>
        </div>
        <div id="controls">
          <button id="btn-undo" disabled>Undo last point</button>
          <button id="btn-clear" disabled>Clear all</button>
          <button id="btn-reverse" disabled>Reverse direction</button>
        </div>
        <div class="field" id="roundtrip-field">
          Round trip from point 1
          <span class="range-label"><span id="range-value">30 – 50</span> km</span>
          <div class="dual-range">
            <div class="range-track" id="range-track"></div>
            <input id="roundtrip-min" type="range" min="5" max="100" step="5" value="30" aria-label="Minimum round trip distance in km" />
            <input id="roundtrip-max" type="range" min="5" max="100" step="5" value="50" aria-label="Maximum round trip distance in km" />
          </div>
          <button id="btn-roundtrip" class="primary generate">Generate round trip</button>
          <label class="checkbox">
            <input type="checkbox" id="roundtrip-hilly" />
            Prefer hills
          </label>
          <div id="wind-chip" hidden></div>
          <div id="loop-options" hidden></div>
        </div>
        <div id="save-section">
          <label class="field">
            Route name
            <input id="route-name" type="text" placeholder="Name" />
          </label>
          <div class="save-actions">
            <button id="btn-save" disabled>Save</button>
            <button id="btn-export" class="primary" disabled>Export GPX</button>
          </div>
          <ul id="saved-list"></ul>
        </div>
        <p id="status" role="status"></p>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
