<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2424e8" />
    <title>Lightroute</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="brand">
          <h1>Lightroute</h1>
          <span class="brand-sub">Route planner</span>
        </header>
        <p class="hint">Click the map to add route points. Drag a point to reroute, click the line to insert a via point.</p>
        <div class="segmented" id="bike-type">
          <button data-bike="race">Race</button>
          <button data-bike="gravel">Gravel</button>
          <button data-bike="mtb">MTB</button>
        </div>
        <label class="field" id="traffic-label">
          Avoid traffic
          <select id="traffic-select">
            <option value="0">No (fastest route)</option>
            <option value="1">Quiet roads</option>
            <option value="2">Very quiet roads</option>
          </select>
        </label>
        <div id="stats">
          <div class="stat">
            <span class="stat-label">Distance</span>
            <span class="stat-value" id="stat-distance">–</span>
          </div>
          <div class="stat">
            <span class="stat-label">Elevation gain</span>
            <span class="stat-value" id="stat-ascend">–</span>
          </div>
        </div>
        <div id="chart-wrap" hidden>
          <canvas id="elevation-chart"></canvas>
        </div>
        <div id="surface" hidden></div>
        <div id="controls">
          <button id="btn-undo" disabled>Undo last point</button>
          <button id="btn-clear" disabled>Clear all</button>
          <button id="btn-export" class="primary" disabled>Export GPX</button>
        </div>
        <label class="field" id="roundtrip-field">
          Round trip from point 1
          <span class="save-row">
            <input id="roundtrip-km" type="number" min="10" max="100" step="5" placeholder="km" />
            <button id="btn-roundtrip">Generate</button>
          </span>
        </label>
        <div id="save-section">
          <label class="field">
            Save route
            <span class="save-row">
              <input id="route-name" type="text" placeholder="Name" />
              <button id="btn-save" disabled>Save</button>
            </span>
          </label>
          <ul id="saved-list"></ul>
        </div>
        <p id="status" role="status"></p>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
