<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2424e8" />
    <title>Lightroute</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="brand">
          <h1>Lightroute</h1>
          <span class="brand-sub">Routeplanner</span>
        </header>
        <p class="hint">Klik op de kaart voor routepunten. Sleep een punt om de route te verleggen, klik op de lijn voor een tussenpunt.</p>
        <div class="segmented" id="bike-type">
          <button data-bike="race">Race</button>
          <button data-bike="gravel">Gravel</button>
          <button data-bike="mtb">MTB</button>
        </div>
        <label class="field" id="traffic-label">
          Drukte vermijden
          <select id="traffic-select">
            <option value="0">Niet (snelste route)</option>
            <option value="1">Rustige wegen</option>
            <option value="2">Zeer rustige wegen</option>
          </select>
        </label>
        <div id="stats">
          <div class="stat">
            <span class="stat-label">Afstand</span>
            <span class="stat-value" id="stat-distance">–</span>
          </div>
          <div class="stat">
            <span class="stat-label">Hoogtemeters</span>
            <span class="stat-value" id="stat-ascend">–</span>
          </div>
        </div>
        <div id="chart-wrap" hidden>
          <canvas id="elevation-chart"></canvas>
        </div>
        <div id="surface" hidden></div>
        <div id="controls">
          <button id="btn-undo" disabled>Laatste punt weg</button>
          <button id="btn-clear" disabled>Alles wissen</button>
          <button id="btn-export" class="primary" disabled>Exporteer GPX</button>
        </div>
        <label class="field" id="roundtrip-field">
          Rondrit vanaf punt 1
          <span class="save-row">
            <input id="roundtrip-km" type="number" min="10" max="100" step="5" placeholder="km" />
            <button id="btn-roundtrip">Genereer</button>
          </span>
        </label>
        <div id="save-section">
          <label class="field">
            Route opslaan
            <span class="save-row">
              <input id="route-name" type="text" placeholder="Naam" />
              <button id="btn-save" disabled>Opslaan</button>
            </span>
          </label>
          <ul id="saved-list"></ul>
        </div>
        <p id="status" role="status"></p>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
