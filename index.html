<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d1342f" />
    <title>Lightroute</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>Lightroute</h1>
        <p class="hint">Klik op de kaart om routepunten te plaatsen. Vanaf twee punten wordt de route berekend.</p>
        <div id="stats">
          <div class="stat">
            <span class="stat-label">Afstand</span>
            <span class="stat-value" id="stat-distance">–</span>
          </div>
          <div class="stat">
            <span class="stat-label">Hoogtemeters</span>
            <span class="stat-value" id="stat-ascend">–</span>
          </div>
        </div>
        <div id="controls">
          <button id="btn-undo" disabled>Laatste punt weg</button>
          <button id="btn-clear" disabled>Alles wissen</button>
          <button id="btn-export" class="primary" disabled>Exporteer GPX</button>
        </div>
        <p id="status" role="status"></p>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
